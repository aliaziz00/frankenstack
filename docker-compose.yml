services:
  db:
    image: postgres:16-alpine
    container_name: frankenstack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: frankenstack
      POSTGRES_PASSWORD: frankenstack
      POSTGRES_DB: frankenstack
    ports:
      - "5432:5432"
    volumes:
      - frankenstack-db-data:/var/lib/postgresql/data

volumes:
  frankenstack-db-data:
